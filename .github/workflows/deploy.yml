name: Deploy to Vercel & Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r credit_engine/requirements.txt
      
      - name: Test backend health
        run: |
          python -c "from api import app; print('✓ Backend imports successfully')"
          python -c "from credit_engine.model_loader import ModelLoader; print('✓ Model loader works')"
  
  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Deploy to Render
        run: |
          # Render auto-deploys on push to main
          # This step triggers deployment via Render webhook
          curl -X POST https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_DEPLOY_KEY }}
        continue-on-error: true
      
      - name: Notify deployment
        run: echo "✓ Backend deployment triggered (Render auto-deploys on push)"
  
  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
  
  health-check:
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Wait for services to be ready
        run: sleep 60
      
      - name: Check backend health
        run: |
          curl -f https://credit-engine-backend.onrender.com/api/health || true
      
      - name: Check frontend health
        run: |
          curl -f https://credit-engine.vercel.app/ || true
